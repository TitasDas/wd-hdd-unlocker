name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit and UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

  build-and-release:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux binary
        run: ./scripts/build-linux.sh

      - name: Smoke test binary
        run: |
          dist/wd-hdd-unlocker --version
          QT_QPA_PLATFORM=offscreen timeout 60 dist/wd-hdd-unlocker --demo --screenshots build/shots
          ls build/shots

      - name: Build .deb
        run: ./scripts/build-deb.sh "${GITHUB_REF_NAME#v}"

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/wd-hdd-unlocker "release/wd-hdd-unlocker-linux-x86_64"
          chmod +x "release/wd-hdd-unlocker-linux-x86_64"
          tar -C release -czf "release/wd-hdd-unlocker-linux-x86_64.tar.gz" wd-hdd-unlocker-linux-x86_64
          cp dist/*.deb release/
          cd release
          sha256sum wd-hdd-unlocker-linux-x86_64 wd-hdd-unlocker-linux-x86_64.tar.gz *.deb > SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/wd-hdd-unlocker-linux-x86_64
            release/wd-hdd-unlocker-linux-x86_64.tar.gz
            release/*.deb
            release/SHA256SUMS.txt
          generate_release_notes: true
